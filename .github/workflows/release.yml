name: Release

# Publishes a signed APK as a GitHub Release, which the in-app updater reads.
# Runs only on a version tag (v*) or by hand, never on an ordinary push, so a
# day-to-day commit never ships an update to the phones.
#
# To release: bump versionCode and versionName in app/build.gradle.kts, add a
# CHANGELOG.md entry, commit, then push a tag (git tag v0.2.0 && git push origin
# v0.2.0) or run this workflow from the Actions tab.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write # to create the Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. Add the four signing secrets first."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/budget-release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/budget-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Assemble release metadata
        id: meta
        run: |
          set -euo pipefail
          VCODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1 || true)
          VNAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1 || true)
          if [ -z "$VCODE" ] || [ -z "$VNAME" ]; then
            echo "::error::Could not read versionCode/versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "vname=$VNAME" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; else TAG="v$VNAME"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Notes: the newest CHANGELOG.md entry.
          awk '/^## /{c++} c==1{print} c==2{exit}' CHANGELOG.md | tail -n +2 > notes.md
          [ -s notes.md ] || echo "Update to $VNAME." > notes.md

          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "::error::No release APK found"; exit 1; fi
          cp "$APK" "budget-$VNAME.apk"

          # What the app reads to decide whether to offer an update.
          jq -n --argjson vc "$VCODE" --arg vn "$VNAME" --rawfile notes notes.md --arg tag "$TAG" --arg apk "budget-$VNAME.apk" \
            '{versionCode:$vc, versionName:$vn, notes:$notes, tag:$tag, apk:$apk}' > latest.json
          cat latest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          VNAME="${{ steps.meta.outputs.vname }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "budget-$VNAME.apk" latest.json --clobber
          else
            gh release create "$TAG" --title "Budget $VNAME" --notes-file notes.md "budget-$VNAME.apk" latest.json
          fi
